name: Cross-Platform Release

on:
  push:
    tags:
      - "v*" # Triggers pipeline only when you push a tag like v1.0.0

permissions:
  contents: write # Required to publish the GitHub Release

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: battery-daemon.exe
            asset_name: battery-daemon-windows-amd64.exe
          - os: macos-latest
            artifact_name: battery-daemon
            asset_name: battery-daemon-macos-universal
          - os: ubuntu-latest
            artifact_name: battery-daemon
            asset_name: battery-daemon-linux-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Compile Release Binary
        run: cargo build --release

      - name: Standardize binary name
        shell: bash
        run: mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.asset_name }}
