[package]
name = "battery-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tray-icon = "0.24"
muda = "0.19"
auto-launch = "0.5.0" # Cross-platform startup registration

# Only compile these heavy dependencies if building on Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "System_Power",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[package.metadata.packager]
product-name = "Battery Daemon"
identifier = "com.adwaithbalakrishnan.batterydaemon"
copyright = "Copyright © 2026 Adwaith Balakrishnan"
icons = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]